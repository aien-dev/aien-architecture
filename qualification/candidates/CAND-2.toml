rust-toolchain-file = "none in any pinned repo (gap G4)"

# What was built and how. Script: ~/workspace/cand3-campaign/cand2/cand2_build.sh (copy in each evidence directory).
[build]
physics = "./m2_build.sh (physics has no Makefile; omega compiles physics m16/nvrm sources directly). physics.bin and atlas_m2.bin rebuild byte for byte equal to the committed files."
omega = "make -j6 PHYSICS_DIR=<physics worktree> OUT_DIR=build/rb all libomega_gpu"
aien-sovereign-core = "cargo fetch --locked into a fresh CARGO_HOME, then scripts/repro-build.sh --offline (cargo build --release --locked with --remap-path-prefix for CARGO_HOME and the repo root) -p aien-cli -p aien-proof -p aien-test, default features (dev-fallback off), AIEN_OMEGA_DIR and AIEN_PHYSICS_DIR set, AIEN_DEV_FALLBACK and AIEN_FORCE_CPU_STUB unset"
release-profile = "opt-level 3, lto true, codegen-units 1, panic abort, strip true (workspace Cargo.toml)"
aienos = "make -C native/kernel -j4, then make -C native/kernel -j4 full (core image and full image)"
aien-cli-target-dir = "<root>/wt-sc/target-rb (root A and root B)"
native-engine-linked = "cargo:rustc-cfg=has_omega_gpu printed by crates/aien-omega-gpu/build.rs; aien-cli carries the string OmegaGb10Backend (native Omega engine, no CUDA, NVIDIA GB10 sm_121)"

# Environment of the production configuration: unchanged from CAND-1.
[env]
AIEN_DEV_FALLBACK = "unset (production strict); CI sets 1 for host test runs, which a strict receipt rejects"
AIEN_FORCE_CPU_STUB = "unset (would force the CPU stub library)"
AIEN_OMEGA_DIR = "omega checkout at omega.lock, required for the native engine link"
AIEN_PHYSICS_DIR = "physics checkout at omega physics.lock, required when physics is not at <omega>/../physics"
AIEN_OMEGA_GPU_LIB = "unset (would link a prebuilt archive without a sha check)"
AIEN_GPU_BACKEND = "omega demands the native backend at run time; AIEN_REQUIRE_BLACKWELL does the same"
AIEN_E2E_CHECKPOINT = "directory of the TinyLlama checkpoint for the real-model gates"
AIEN_MODEL_PATH = "safetensors file for aien-cli; with AIEN_TOKENIZER_PATH, AIEN_MODEL_DIR, AIEN_REQUIRE_CHECKPOINT=1 (no fallback to reference weights)"

