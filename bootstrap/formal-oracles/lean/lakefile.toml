name = "aien_formal_oracle"
defaultTargets = ["AienCap", "AienReceipt"]

# Core Lean only. No Mathlib, no Batteries, no other dependency: builds offline.

[[lean_lib]]
name = "AienCap"

[[lean_lib]]
name = "MutantModels"
globs = ["MutantModels"]

# Each claim file states a real-model theorem against a mutant model.
# It must FAIL to build. The runner checks that.
[[lean_lib]]
name = "MutantScopeClaim"
globs = ["MutantScopeClaim"]

[[lean_lib]]
name = "MutantExpiryClaim"
globs = ["MutantExpiryClaim"]

[[lean_lib]]
name = "MutantDepthClaim"
globs = ["MutantDepthClaim"]

# FORMAL-4: receipt consistency model (AIEN.INV.RECEIPT.REJECTION_CONSISTENCY.V1).
[[lean_lib]]
name = "AienReceipt"

# FORMAL-4 mutants: models compile, each claim file must FAIL to build.
[[lean_lib]]
name = "MutantReceiptModels"
globs = ["MutantReceiptModels"]

[[lean_lib]]
name = "MutantRejectedRanClaim"
globs = ["MutantRejectedRanClaim"]

[[lean_lib]]
name = "MutantNoReasonClaim"
globs = ["MutantNoReasonClaim"]

[[lean_lib]]
name = "MutantNonRejectedFieldsClaim"
globs = ["MutantNonRejectedFieldsClaim"]

[[lean_lib]]
name = "MutantCanaryClaim"
globs = ["MutantCanaryClaim"]

[[lean_lib]]
name = "MutantAbsentFlagClaim"
globs = ["MutantAbsentFlagClaim"]
