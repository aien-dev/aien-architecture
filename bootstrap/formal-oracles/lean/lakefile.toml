name = "aien_formal_oracle"
defaultTargets = ["AienCap", "AienReceipt", "AienSeq", "AienKv"]

# Core Lean only. No Mathlib, no Batteries, no other dependency: builds offline.

[[lean_lib]]
name = "AienCap"

[[lean_lib]]
name = "MutantModels"
globs = ["MutantModels"]

# Each claim file states a real-model theorem against a mutant model.
# It must FAIL to build. The runner checks that.
[[lean_lib]]
name = "MutantScopeClaim"
globs = ["MutantScopeClaim"]

[[lean_lib]]
name = "MutantExpiryClaim"
globs = ["MutantExpiryClaim"]

[[lean_lib]]
name = "MutantDepthClaim"
globs = ["MutantDepthClaim"]

# FORMAL-4: receipt consistency model (AIEN.INV.RECEIPT.REJECTION_CONSISTENCY.V1).
[[lean_lib]]
name = "AienReceipt"

# FORMAL-4 mutants: models compile, each claim file must FAIL to build.
[[lean_lib]]
name = "MutantReceiptModels"
globs = ["MutantReceiptModels"]

[[lean_lib]]
name = "MutantRejectedRanClaim"
globs = ["MutantRejectedRanClaim"]

[[lean_lib]]
name = "MutantNoReasonClaim"
globs = ["MutantNoReasonClaim"]

[[lean_lib]]
name = "MutantNonRejectedFieldsClaim"
globs = ["MutantNonRejectedFieldsClaim"]

[[lean_lib]]
name = "MutantCanaryClaim"
globs = ["MutantCanaryClaim"]

[[lean_lib]]
name = "MutantAbsentFlagClaim"
globs = ["MutantAbsentFlagClaim"]

# FORMAL-6: sequence identity (AIEN.INV.SEQUENCE.STALE_ID.V1) and KV layout bounds (AIEN.INV.KV.LAYOUT_BOUNDS.V1).
[[lean_lib]]
name = "AienSeq"

[[lean_lib]]
name = "AienKv"

[[lean_lib]]
name = "MutantSeqModels"
globs = ["MutantSeqModels"]

[[lean_lib]]
name = "MutantSeqNoBumpClaim"
globs = ["MutantSeqNoBumpClaim"]

[[lean_lib]]
name = "MutantSeqIgnoreGenClaim"
globs = ["MutantSeqIgnoreGenClaim"]

[[lean_lib]]
name = "MutantSeqZeroWrapClaim"
globs = ["MutantSeqZeroWrapClaim"]

[[lean_lib]]
name = "MutantSeqActiveClaim"
globs = ["MutantSeqActiveClaim"]

[[lean_lib]]
name = "MutantSeqForkClaim"
globs = ["MutantSeqForkClaim"]

[[lean_lib]]
name = "MutantKvModels"
globs = ["MutantKvModels"]

[[lean_lib]]
name = "MutantKvPlanesClaim"
globs = ["MutantKvPlanesClaim"]

[[lean_lib]]
name = "MutantKvTotalClaim"
globs = ["MutantKvTotalClaim"]

[[lean_lib]]
name = "MutantKvTokenClaim"
globs = ["MutantKvTokenClaim"]

[[lean_lib]]
name = "MutantKvValidClaim"
globs = ["MutantKvValidClaim"]

[[lean_lib]]
name = "MutantKvBlockClaim"
globs = ["MutantKvBlockClaim"]
