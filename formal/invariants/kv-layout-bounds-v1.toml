[[observations]]
surface = "crates/aien-kv-cache/src/lib.rs"
text = """
from_config multiplies usize values with plain operators (no checked_mul) and never refuses a zero dimension or an oversized config. \
Reproduced on a release build of the real crate at dd1fe32: num_blocks = 2^45 with the TinyLlama dimensions and Fp32 returns Ok with \
total_bytes = 6917529027641081856 while the true product is 25364273101350633472 (>= 2^64). The pool constructor then compares the \
buffer length with the wrapped total. No such config is reachable from current callers (arena capacity and block counts are small); the \
risk is latent. Recorded, not fixed (formal verification does not edit the PREFILL surfaces)."""

[[observations]]
surface = "crates/aien-kv-cache/src/lib.rs"
text = """
bytes_per_block (line 107) is computed separately as ceil(elements * bytes_per_element as f32); for the integer dtypes it equals the \
layout block stride (theorem block_eq_bytes_per_block). It goes through f32, which is exact only below 2^24 elements per block; larger \
configs would round. Not modelled."""
