[[observations]]
surface = "crates/aien-runtime/src/sequence.rs"
text = """
free (197 to 209) bumps the generation with wrapping_add(1).max(1), so the runtime arena has no retire path: a slot freed 2^32 - 1 times \
reissues an old id. get (178) resolves on slot-in-range, equal generation and a present record. allocate and fork pop a free slot and \
hand out its current generation. active_count is incremented on both and decremented with saturating_sub on free; the model proves the \
subtraction never saturates for a well formed arena."""

[[observations]]
surface = "crates/aien-scheduler/src/sequence.rs"
text = """
divergence between the two arenas: the scheduler arena retires a slot when its generation reaches u32::MAX (free_sequence, 512 to 523) \
and never reuses it, so it has no ABA window at the cost of capacity; the runtime arena wraps. Both are in production code in the same \
workspace. Recorded, not asserted either way. insert_with_id in the scheduler arena also accepts a caller supplied generation and sets the \
slot generation to it, which the model does not cover."""
