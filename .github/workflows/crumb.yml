name: Crumb compiler
on:
  # Retired from pull requests and pushes on 2026-10-16 (ADR 0033 Decision 11, phase 3): the Spark
  # runs these gates (tests/gates/) and the required AIEN Verification check verifies its signed
  # bundle. Kept as a manual trigger so a hosted run is still possible when needed.
  workflow_dispatch:

permissions:
  contents: read
jobs:
  crumb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test the crumb tool
        run: make -C tools/crumb test
      - name: Crumbs must be exactly what the compiler produces now
        run: ./tools/crumb/crumb verify .
