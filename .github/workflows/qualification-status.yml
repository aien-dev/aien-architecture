name: Qualification status
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  r16:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: aien-dev/omega
          path: omega-evidence
      - run: python3 scripts/verify-r16-status.py omega-evidence
